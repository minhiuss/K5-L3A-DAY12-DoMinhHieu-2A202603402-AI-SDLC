<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    :root { --gold: #ffc35a; --ink: #140b22; --panel: rgba(18, 10, 32, 0.58); --text: #f6e7c8; --muted: #c9b8ea; }
    html, body { margin: 0; height: 100%; background: #0b0814; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
    canvas { display: block; }
    #hud { position: fixed; top: 14px; left: 14px; display: grid; gap: 6px; padding: 12px 16px; border-radius: 14px;
           background: var(--panel); backdrop-filter: blur(6px); border: 1px solid rgba(255, 195, 90, 0.18);
           font-size: 14px; min-width: 230px; pointer-events: none; }
    #hud .row { display: flex; align-items: center; gap: 6px; }
    #hud .row > span { width: 78px; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    #hud b { color: var(--gold); margin-left: 4px; }
    #hud .score { font-size: 18px; }
    .flame { width: 12px; height: 16px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
             background: radial-gradient(circle at 50% 70%, #fff3b0, #ff9b2f 55%, #d6451f); box-shadow: 0 0 8px #ff9b2f; }
    .flame.out { background: #3a2a40; box-shadow: none; }
    .mote { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(#fffbe0, #ffd23a 60%, #c98a10); box-shadow: 0 0 6px #ffd23a; }
    .mote.empty { background: #2c2238; box-shadow: none; border: 1px solid #4a3d5c; }
    .lamp { width: 11px; height: 14px; border-radius: 45%; background: #4a2420; border: 1px solid #6e3a2e; }
    .lamp.lit { background: radial-gradient(#ffe7a0, #ff8a2a 65%); box-shadow: 0 0 8px #ff9a3c; border-color: #ffb04a; }
    .bar { width: 100px; height: 6px; border-radius: 3px; background: #2c2238; overflow: hidden; }
    .bar > div { height: 100%; background: linear-gradient(90deg, #ffd27a, #fff3c2); }
    #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 10px;
            background: var(--panel); font-size: 13px; color: var(--muted); pointer-events: none; text-align: center; max-width: calc(100% - 32px); }
    #prompt { position: fixed; top: 60%; left: 50%; transform: translateX(-50%); font-size: 17px; color: #ffd98a;
              text-shadow: 0 0 10px #000, 0 0 3px #000; pointer-events: none; }
    #debug { position: fixed; top: 14px; right: 14px; padding: 6px 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.6);
             font: 12px ui-monospace, Consolas, monospace; color: #9ff59f; pointer-events: none; max-width: 60vw; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               background: radial-gradient(ellipse at center, rgba(20, 8, 36, 0.35), rgba(5, 2, 12, 0.8)); }
    #overlay.hidden { display: none; }
    #card { max-width: 460px; margin: 16px; padding: 26px 30px; border-radius: 18px; background: rgba(28, 16, 46, 0.92); text-align: center;
            border: 1px solid rgba(255, 195, 90, 0.3); box-shadow: 0 0 60px rgba(255, 160, 60, 0.25); }
    #card h1 { margin: 0 0 6px; color: var(--gold); font-size: 34px; letter-spacing: 0.02em; text-shadow: 0 0 18px rgba(255, 170, 60, 0.6); }
    #card .sub { color: var(--muted); margin-top: 0; }
    #card .big { font-size: 28px; color: var(--gold); }
    #card p { margin: 8px 0; color: #eadcff; line-height: 1.45; }
    #card button { margin-top: 14px; padding: 10px 24px; font-size: 16px; border: 0; border-radius: 10px; cursor: pointer;
                   background: linear-gradient(180deg, #ffcf6e, #f39a2c); color: #2a1600; font-weight: 600; box-shadow: 0 0 18px rgba(255, 160, 60, 0.5); }
    #flash { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(120, 20, 90, 0.55)); opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="prompt"></div>
  <div id="debug" hidden></div>
  <div id="hint">WASD đi · kéo chuột / ← → xoay · lăn chuột zoom · Space nhảy · E đổ đom đóm · F pulse · R chơi lại · ` FPS</div>
  <div id="flash"></div>
  <div id="overlay"><div id="card"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
