<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0814; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; color: #ffe9c2; }
    canvas { display: block; }
    #hud { position: fixed; top: 12px; left: 12px; display: grid; gap: 4px; padding: 10px 14px; border-radius: 10px;
           background: rgba(20, 12, 30, 0.62); font-size: 15px; line-height: 1.35; min-width: 210px; pointer-events: none; }
    #hud b { color: #ffc35a; }
    #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px;
            background: rgba(20, 12, 30, 0.62); font-size: 13px; color: #d9c8ff; pointer-events: none; text-align: center; }
    #prompt { position: fixed; top: 58%; left: 50%; transform: translateX(-50%); font-size: 16px; color: #ffd27a;
              text-shadow: 0 0 6px #000; pointer-events: none; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               background: rgba(8, 4, 16, 0.6); }
    #overlay.hidden { display: none; }
    #card { max-width: 440px; margin: 16px; padding: 22px 26px; border-radius: 14px; background: #1c1229; text-align: center;
            box-shadow: 0 0 40px rgba(255, 170, 60, 0.25); }
    #card h1 { margin: 0 0 8px; color: #ffc35a; font-size: 28px; }
    #card p { margin: 6px 0; color: #e8dcff; }
    #card button { margin-top: 12px; padding: 8px 20px; font-size: 16px; border: 0; border-radius: 8px; background: #ffb547;
                   color: #2a1600; cursor: pointer; }
    #flash { position: fixed; inset: 0; background: rgba(150, 20, 60, 0.35); opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="prompt"></div>
  <div id="hint">WASD đi · chuột kéo / ← → xoay camera · Space nhảy · E đổ đom đóm vào đèn · F pulse · R chơi lại</div>
  <div id="flash"></div>
  <div id="overlay"><div id="card"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
