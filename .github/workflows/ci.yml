name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: headless smoke + determinism
        run: |
          node headless.mjs --seed 5 --night 1 --ticks 3000 --out a.jsonl
          node headless.mjs --seed 5 --night 1 --ticks 3000 --out b.jsonl
          cmp a.jsonl b.jsonl
          tail -n 1 a.jsonl
